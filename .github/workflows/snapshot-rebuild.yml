name: Snapshot Rebuild

on:
  repository_dispatch:
    types: [forkcast-data-snapshot]
  workflow_dispatch:
    inputs:
      target_snapshot:
        description: "Target snapshot ID"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild"
        required: false
        default: false
        type: boolean
      deploy_target:
        description: "Deploy target"
        required: true
        default: "pages"
        type: choice
        options: ["pages", "artifact-only"]
  schedule:
    - cron: "8 1,13 * * *"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_TARGET: ${{ inputs.deploy_target || vars.FORKCAST_ASTRO_DEPLOY_TARGET || 'pages' }}
      FORKCAST_PUBLIC_BASE_PATH: /forkcast-astro
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check remote snapshot
        id: snapshot
        env:
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://dionysuzx.github.io/forkcast-data' }}
          FORKCAST_ASTRO_SITE_URL: ${{ vars.FORKCAST_ASTRO_SITE_URL || 'https://dionysuzx.github.io/forkcast-astro' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          DISPATCH_SNAPSHOT: ${{ github.event.client_payload.snapshot }}
          INPUT_SNAPSHOT: ${{ inputs.target_snapshot || '' }}
        run: |
          data_base="${FORKCAST_DATA_BASE_URL%/}"
          requested_id="${DISPATCH_SNAPSHOT:-$INPUT_SNAPSHOT}"
          latest_root="$data_base/latest"

          if [ -n "$DISPATCH_SNAPSHOT" ]; then
            latest_id=""
            for attempt in $(seq 1 18); do
              latest_id=$(DATA_BASE="$data_base" node --input-type=module -e "const r=await fetch(process.env.DATA_BASE + '/latest/manifest.json', { cache: 'no-store' }); if(!r.ok) throw new Error(String(r.status)); const j=await r.json(); console.log(j.snapshot_id)" )
              if [ "$DISPATCH_SNAPSHOT" = "$latest_id" ]; then
                break
              fi
              echo "Waiting for GitHub Pages latest snapshot. expected=$DISPATCH_SNAPSHOT observed=$latest_id attempt=$attempt"
              sleep 10
            done
            if [ "$DISPATCH_SNAPSHOT" != "$latest_id" ]; then
              echo "Repository dispatch snapshot $DISPATCH_SNAPSHOT does not match remote latest $latest_id"
              exit 1
            fi
          fi

          if [ -n "$requested_id" ]; then
            latest_root="$data_base/snapshots/$requested_id"
          fi

          remote_id=$(LATEST_ROOT="$latest_root" node --input-type=module -e "const r=await fetch(process.env.LATEST_ROOT + '/manifest.json', { cache: 'no-store' }); if(!r.ok) throw new Error(String(r.status)); const j=await r.json(); console.log(j.snapshot_id)" )
          deployed_id=$(node --input-type=module -e "const site=process.env.FORKCAST_ASTRO_SITE_URL?.replace(/\/$/, ''); if(!site) process.exit(0); const r=await fetch(site + '/_snapshot.json', { cache: 'no-store' }).catch(() => null); if(!r?.ok) process.exit(0); const j=await r.json(); console.log(j.snapshotId || j.snapshot_id || '')" || true)

          should_rebuild=false
          if [ "$remote_id" != "$deployed_id" ] || [ "$FORCE_REBUILD" = "true" ]; then
            should_rebuild=true
          fi
          echo "remote_id=$remote_id" >> "$GITHUB_OUTPUT"
          echo "deployed_id=$deployed_id" >> "$GITHUB_OUTPUT"
          echo "latest_root=$latest_root" >> "$GITHUB_OUTPUT"
          echo "should_rebuild=$should_rebuild" >> "$GITHUB_OUTPUT"
      - name: Sync pinned snapshot
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: |
          pnpm data:forkcast-snapshot -- --latest-root "${{ steps.snapshot.outputs.latest_root }}" --data-base-url "$FORKCAST_DATA_BASE_URL"
        env:
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://dionysuzx.github.io/forkcast-data' }}
      - if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: pnpm verify
      - if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: pnpm pages:base
      - name: Upload resolved snapshot metadata
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: |
          mkdir -p .forkcast-deploy
          cp forkcast-data.snapshot.json .forkcast-deploy/forkcast-data.snapshot.json
          cp src/domain/forkcast-data/pinned-snapshot.json .forkcast-deploy/pinned-snapshot.json
      - uses: actions/upload-artifact@v4
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        with:
          name: forkcast-astro-snapshot-${{ steps.snapshot.outputs.remote_id }}
          path: .forkcast-deploy
      - uses: actions/configure-pages@v4
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' && env.DEPLOY_TARGET == 'pages' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' && env.DEPLOY_TARGET == 'pages' }}
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' && env.DEPLOY_TARGET == 'pages' }}
        uses: actions/deploy-pages@v4
