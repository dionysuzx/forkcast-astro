name: Snapshot Rebuild

on:
  repository_dispatch:
    types: [forkcast-data-snapshot]
  workflow_dispatch:
    inputs:
      target_snapshot:
        description: "Target snapshot ID"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild"
        required: false
        default: false
        type: boolean
      deploy_target:
        description: "Netlify deploy target"
        required: true
        default: "preview"
        type: choice
        options: ["preview", "prod"]
  schedule:
    - cron: "*/30 * * * *"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check remote snapshot
        id: snapshot
        env:
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://forkcast-data-dionysuzx.netlify.app' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          remote_id=$(node --input-type=module -e "const r=await fetch(process.env.FORKCAST_DATA_BASE_URL.replace(/\/$/, '') + '/latest/manifest.json'); if(!r.ok) throw new Error(String(r.status)); const j=await r.json(); console.log(j.snapshot_id)")
          current_id=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('forkcast-data.snapshot.json', 'utf8')).snapshotId)")
          should_rebuild=false
          if [ "$remote_id" != "$current_id" ] || [ "$FORCE_REBUILD" = "true" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            should_rebuild=true
          fi
          echo "remote_id=$remote_id" >> "$GITHUB_OUTPUT"
          echo "should_rebuild=$should_rebuild" >> "$GITHUB_OUTPUT"
      - name: Sync pinned snapshot
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: |
          latest_root="${FORKCAST_DATA_LATEST_ROOT:-${FORKCAST_DATA_BASE_URL%/}/latest}"
          pnpm data:forkcast-snapshot -- --latest-root "$latest_root" --data-base-url "$FORKCAST_DATA_BASE_URL"
        env:
          FORKCAST_DATA_LATEST_ROOT: ${{ vars.FORKCAST_DATA_LATEST_ROOT }}
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://forkcast-data-dionysuzx.netlify.app' }}
      - if: ${{ steps.snapshot.outputs.should_rebuild == 'true' }}
        run: pnpm verify
      - name: Deploy preview
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' && inputs.deploy_target != 'prod' }}
        run: npx netlify deploy --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Deploy production
        if: ${{ steps.snapshot.outputs.should_rebuild == 'true' && inputs.deploy_target == 'prod' }}
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
