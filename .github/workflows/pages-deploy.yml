name: Pages Deploy

on:
  workflow_dispatch:
    inputs:
      target_snapshot:
        description: "Optional snapshot to sync before deploy"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild"
        default: false
        type: boolean
      deploy_target:
        description: "pages or artifact-only"
        required: true
        default: "pages"
        type: choice
        options: ["pages", "artifact-only"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forkcast-astro-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORKCAST_PUBLIC_BASE_PATH: /forkcast-astro
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync requested snapshot
        if: ${{ inputs.target_snapshot != '' || inputs.force_rebuild == true }}
        run: |
          if [ -n "${TARGET_SNAPSHOT}" ]; then
            latest_root="${FORKCAST_DATA_BASE_URL%/}/snapshots/${TARGET_SNAPSHOT}"
          else
            latest_root="${FORKCAST_DATA_LATEST_ROOT:-${FORKCAST_DATA_BASE_URL%/}/latest}"
          fi
          pnpm data:forkcast-snapshot -- --latest-root "$latest_root" --data-base-url "$FORKCAST_DATA_BASE_URL"
        env:
          TARGET_SNAPSHOT: ${{ inputs.target_snapshot }}
          FORKCAST_DATA_LATEST_ROOT: ${{ vars.FORKCAST_DATA_LATEST_ROOT }}
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://dionysuzx.github.io/forkcast-data' }}
      - run: pnpm verify
      - run: pnpm pages:base
      - name: Capture snapshot id
        id: snapshot
        run: |
          snapshot_id=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('forkcast-data.snapshot.json', 'utf8')).snapshotId)")
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: forkcast-astro-pages-${{ steps.snapshot.outputs.snapshot_id }}
          path: dist
      - uses: actions/configure-pages@v4
        if: ${{ inputs.deploy_target == 'pages' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_target == 'pages' }}
        with:
          path: dist
      - id: deployment
        if: ${{ inputs.deploy_target == 'pages' }}
        uses: actions/deploy-pages@v4
