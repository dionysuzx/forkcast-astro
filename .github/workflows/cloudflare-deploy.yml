name: Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      target_snapshot:
        description: "Optional snapshot to sync before deploy"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild"
        default: false
        type: boolean
      deploy_target:
        description: "cloudflare or artifact-only"
        required: true
        default: "cloudflare"
        type: choice
        options: ["cloudflare", "artifact-only"]

permissions:
  contents: read

concurrency:
  group: forkcast-astro-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://forkcast-astro.pages.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync requested snapshot
        if: ${{ inputs.target_snapshot != '' || inputs.force_rebuild == true }}
        run: |
          if [ -n "${TARGET_SNAPSHOT}" ]; then
            latest_root="${FORKCAST_DATA_BASE_URL%/}/snapshots/${TARGET_SNAPSHOT}"
          else
            latest_root="${FORKCAST_DATA_LATEST_ROOT:-${FORKCAST_DATA_BASE_URL%/}/latest}"
          fi
          pnpm data:forkcast-snapshot -- --latest-root "$latest_root" --data-base-url "$FORKCAST_DATA_BASE_URL"
        env:
          TARGET_SNAPSHOT: ${{ inputs.target_snapshot }}
          FORKCAST_DATA_LATEST_ROOT: ${{ vars.FORKCAST_DATA_LATEST_ROOT }}
          FORKCAST_DATA_BASE_URL: ${{ vars.FORKCAST_DATA_BASE_URL || 'https://forkcast-data.pages.dev' }}
      - run: pnpm verify
      - name: Capture snapshot id
        id: snapshot
        run: |
          snapshot_id=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('forkcast-data.snapshot.json', 'utf8')).snapshotId)")
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: forkcast-astro-cloudflare-${{ steps.snapshot.outputs.snapshot_id }}
          path: dist
      - name: Deploy to Cloudflare Pages
        if: ${{ inputs.deploy_target == 'cloudflare' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required for Cloudflare Pages deploys" >&2
            exit 1
          fi
          npx wrangler pages deploy dist \
            --project-name forkcast-astro \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Forkcast Astro snapshot ${{ steps.snapshot.outputs.snapshot_id }}"
